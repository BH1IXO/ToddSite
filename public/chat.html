<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>跟我聊聊 · 刘涛 Todd</title>
<style>
/* 布局：线框内居中，对话窗口占满剩余高度 */
:root{--bg:#FFFFFF;--fg:#111111;--mute:#6B6B72;--line:#E4E4E7;--card:#FFFFFF;--soft:#F7F7F8;--accent:#111111;--w:72rem;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}}
:root[data-theme='dark']{--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
.frame{width:100%;max-width:var(--w);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.pad{padding-left:clamp(18px,4vw,56px);padding-right:clamp(18px,4vw,56px)}
.bar{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--line);font-size:14px;gap:16px}
.bar a{text-decoration:none}.bar nav{display:flex;gap:20px;color:var(--mute)}.bar nav a:hover,.bar nav .on{color:var(--fg)}
main{padding-top:40px;padding-bottom:60px;max-width:52rem}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font-size:clamp(2rem,5vw,3rem);letter-spacing:-.04em;margin:10px 0 0;font-weight:600}
.lead{color:var(--mute);margin:12px 0 24px}
.chat{border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden}
.chat-top{padding:12px 16px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.chat-top b{color:var(--fg)}
.msgs{height:min(520px,58vh);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:85%;padding:10px 14px;border-radius:6px;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.m.bot{align-self:flex-start;background:var(--soft)}
.m.me{align-self:flex-end;background:var(--fg);color:var(--bg)}
.m.err{align-self:flex-start;color:var(--mute);border:1px dashed var(--line)}
.quick{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 12px}
.quick button{font:inherit;font-size:12.5px;cursor:pointer;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:4px;padding:4px 10px}
.quick button:hover{color:var(--fg);border-color:var(--fg)}
.chat-in{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chat-in input{flex:1;min-width:0;font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 12px}
.chat-in button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--bg);background:var(--fg);border:1px solid var(--fg);border-radius:4px;padding:8px 18px}
.chat-in button:disabled{opacity:.5;cursor:not-allowed}
.contact{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--line)}
.contact div{padding:12px 16px 12px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.contact small{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.1em}
</style>
<link rel='stylesheet' href='/theme.css'>
</head>
<body>
<div class='frame'>
<div class='bar pad'><a href='/'>← 刘涛 Todd</a><nav><a href='/'>首页</a><a href='/courses'>课程</a><a href='/blog'>博客</a><a class='on' href='/chat'>跟我聊聊</a></nav></div>
<main class='pad'>
<p class='kicker'>Contact</p>
<h1>跟我聊聊</h1>
<p class='lead' id='note'>想聊 AI 落地、产品或合作，直接问我的 AI 分身。</p>
<div class='chat'>
<div class='chat-top'><b>我的 AI 分身</b> · 基于网站上的公开内容回答，想找我本人请用下面的联系方式</div>
<div class='msgs' id='msgs' aria-live='polite'></div>
<div class='quick' id='quick'></div>
<div class='chat-in'><input id='chat-input' maxlength='300' placeholder='问点什么，比如：你们做 GEO 是怎么回事？' aria-label='给分身发消息'><button id='chat-send' type='button'>发送</button></div>
</div>
<div class='contact' id='contact'></div>
</main>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var hist=[],busy=false;
  function add(cls,t){var e=document.createElement('div');e.className='m '+cls;e.textContent=t;var b=$('msgs');b.appendChild(e);b.scrollTop=b.scrollHeight;return e}
  function send(text){
    text=String(text||'').trim();if(!text||busy)return;
    busy=true;$('chat-send').disabled=true;$('chat-input').value='';$('quick').hidden=true;
    add('me',text);hist.push({role:'user',content:text});
    var out=add('bot','…'),got='';
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist.slice(-10)})}).then(function(r){
      if(!r.ok||!r.body){return r.json().catch(function(){return {}}).then(function(j){throw new Error(j.error||'分身这会儿没响应，稍后再试。')})}
      var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
      function pump(){return rd.read().then(function(x){
        if(x.done)return;
        buf+=dec.decode(x.value,{stream:true});
        var i;while((i=buf.indexOf('\n\n'))>=0){var line=buf.slice(0,i).trim();buf=buf.slice(i+2);
          if(line.indexOf('data:')!==0)continue;var d=line.slice(5).trim();if(d==='[DONE]')continue;
          try{got+=JSON.parse(d).content||'';out.textContent=got;$('msgs').scrollTop=$('msgs').scrollHeight}catch(e){}}
        return pump()})}
      return pump();
    }).then(function(){if(got){hist.push({role:'assistant',content:got})}else{out.className='m err';out.textContent='分身没有给出回答，请换个问法再试。'}})
    .catch(function(e){out.className='m err';out.textContent=e.message;hist.pop()})
    .then(function(){busy=false;$('chat-send').disabled=false;$('chat-input').focus()});
  }
  add('bot','你好，我是 Todd 的 AI 分身。可以问我他做过的项目、课程，或者怎么合作。');
  var qs=['你现在在做什么？','GEO 是做什么的？','怎么跟你合作？','课程讲什么？'];
  $('quick').innerHTML=qs.map(function(q){return '<button type=button>'+q+'</button>'}).join('');
  $('quick').addEventListener('click',function(e){var b=e.target.closest('button');if(b)send(b.textContent)});
  $('chat-send').addEventListener('click',function(){send($('chat-input').value)});
  $('chat-input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send($('chat-input').value)}});
  fetch('/api/site').then(function(r){return r.json()}).then(function(d){
    var c=d.contact||{},rows=[];
    if(c.note)$('note').textContent=c.note;
    if(c.email)rows.push(['邮箱',c.email]);
    if(c.wechat)rows.push(['微信',c.wechat]);
    (d.socials||[]).forEach(function(s){rows.push([s.name,s.handle||''])});
    $('contact').innerHTML='';
    rows.forEach(function(r){var el=document.createElement('div');var s=document.createElement('small');s.textContent=r[0];el.appendChild(s);el.appendChild(document.createTextNode(r[1]));$('contact').appendChild(el)});
  }).catch(function(){});
})();
</script>
<script src='/theme.js'></script>
</body>
</html>
