<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>课程 · 刘涛 Todd</title>
<style>
/* 布局：线框内居中，课程按三列方块排列 */
:root{--bg:#FFFFFF;--fg:#111111;--mute:#6B6B72;--line:#E4E4E7;--card:#FFFFFF;--soft:#F7F7F8;--accent:#111111;--w:72rem;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}}
:root[data-theme='dark']{--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
.frame{width:100%;max-width:var(--w);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.pad{padding-left:clamp(18px,4vw,56px);padding-right:clamp(18px,4vw,56px)}
.bar{display:flex;justify-content:space-between;align-items:center;height:60px;border-bottom:1px solid var(--line);font-size:15.5px;gap:16px}
.bar a{text-decoration:none}.bar nav{display:flex;gap:22px;color:var(--mute)}.bar nav a:hover,.bar nav .on{color:var(--fg)}
main{padding-top:48px;padding-bottom:80px}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:-.04em;margin:10px 0 0;font-weight:600}
.lead{color:var(--mute);margin:12px 0 28px;font-size:1.05rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:4px;background:var(--card);transition:border-color .3s,transform .3s}
.card:hover{border-color:var(--fg);transform:translateY(-3px)}
.idx{font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--mute);padding:18px 20px 0}
.card h3{margin:8px 0 0;padding:0 20px;font-size:19px;font-weight:600;line-height:1.5}
.card ul{margin:10px 0 0;padding:0 20px 20px;list-style:none;font-size:15px;line-height:1.75;color:var(--mute);flex:1}
.card li{padding-left:12px;position:relative}
.card li::before{content:'·';position:absolute;left:0}
@media (max-width:900px){.grid3{grid-template-columns:1fr}}
/* 多课程分组：每门课一个区块 */
.group{margin-top:44px}
.ghead{margin:0 0 22px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.gk{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--accent);margin:0}
.group h2{font-size:clamp(1.5rem,3.4vw,2rem);letter-spacing:-.03em;margin:6px 0 0;font-weight:600;line-height:1.35}
.gsub{color:var(--mute);margin:6px 0 0;font-size:1rem}
.gaud{color:var(--mute);margin:2px 0 0;font-size:14.5px}
.badge{display:inline-block;vertical-align:middle;font-family:var(--mono);font-size:12px;letter-spacing:.08em;font-weight:400;border:1px solid var(--line);border-radius:999px;padding:0 10px;color:var(--mute);line-height:1.9;white-space:nowrap}
.empty{margin:0;border:1px dashed var(--line);border-radius:4px;background:var(--soft);padding:28px 20px;color:var(--mute);font-size:15px}
/* 防溢出兜底 */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
img,video,pre,table{max-width:100%}
h1,h2,h3,h4,h5,h6,p{overflow-wrap:break-word;word-break:break-word}
/* 手机补充：导航、标题行距、卡片间距 */
@media (max-width:760px){
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
}
@media (max-width:480px){
.bar{gap:8px;font-size:15px}
.bar a{display:flex;align-items:center;min-height:44px;white-space:nowrap}
.bar nav{gap:0;margin-right:-6px;font-size:14px;flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{flex:none;padding:0 6px}
main{padding-top:28px;padding-bottom:56px}
h1{font-size:clamp(1.8rem,8vw,2.2rem);line-height:1.3}
.lead{margin:10px 0 20px;font-size:15px}
.grid3{gap:14px}
.group{margin-top:32px}
.ghead{margin-bottom:16px;padding-bottom:12px}
.group h2{font-size:1.4rem}
.gsub{font-size:15px}
.gaud{font-size:14px}
.empty{padding:20px 16px;font-size:14.5px}
.idx{padding:14px 16px 0}
.card h3{padding:0 16px;font-size:18px}
.card ul{padding:0 16px 16px;font-size:14.5px}
}
@media (hover:none){.card:hover{transform:none}}
</style>
<link rel='stylesheet' href='/theme.css'>
</head>
<body>
<div class='frame'>
<div class='bar pad'><a href='/'>← 刘涛 Todd</a><nav><a href='/'>首页</a><a class='on' href='/courses'>课程</a><a href='/blog'>博客</a><a href='/chat'>聊聊</a></nav></div>
<main class='pad'>
<p class='kicker'>Course</p>
<h1 id='ttl'>课程</h1>
<p class='lead' id='intro'></p>
<div id='groups'></div>
</main>
</div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function pad2(n){n=parseInt(n,10)||0;return (n<10?'0':'')+n}
  fetch('/api/site',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    var c=d.courses||{},gs=Array.isArray(c.groups)?c.groups:(c.lessons?[{id:'course',title:c.title,subtitle:c.intro,status:'open',lessons:c.lessons}]:[]);
    var nOpen=gs.filter(function(g){return g.status!=='wip'}).length;
    document.getElementById('intro').textContent=gs.length?('共 '+gs.length+' 门课程，'+nOpen+' 门已开课'+(gs.length>nOpen?'，'+(gs.length-nOpen)+' 门筹备中':'')+'。'):'课程内容整理中。';
    document.getElementById('groups').innerHTML=gs.map(function(g,gi){
      var wip=g.status==='wip',ls=g.lessons||[];
      var cards=ls.map(function(l){
        var pts=(l.points||[]).slice(0,4).map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
        return '<div class="card"><span class="idx">LESSON '+pad2(l.no)+'</span><h3>'+esc(l.title)+'</h3><ul>'+pts+'</ul></div>';
      }).join('');
      var body=ls.length?'<div class="grid3">'+cards+'</div>':'<p class="empty">'+(wip?'课程内容筹备中，开课后会第一时间更新在这里。':'讲次整理中。')+'</p>';
      return '<section class="group'+(wip?' wip':'')+'" id="c-'+String(g.id||gi).replace(/[^a-z0-9-]/gi,'')+'"><header class="ghead"><p class="gk">COURSE '+pad2(gi+1)+'</p><h2>'+esc(g.title)+(wip?' <span class="badge">筹备中</span>':'')+'</h2>'+(g.subtitle?'<p class="gsub">'+esc(g.subtitle)+'</p>':'')+(g.audience?'<p class="gaud">适合：'+esc(g.audience)+'</p>':'')+'</header>'+body+'</section>';
    }).join('');
  }).catch(function(){document.getElementById('intro').textContent='加载失败，请刷新重试。'});
})();
</script>
<script src='/theme.js'></script>
</body>
</html>
