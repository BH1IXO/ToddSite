<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>文章 · 刘涛 Todd</title>
<style>
/* 布局：与首页一致的线框，单栏阅读，正文宽度约 40em */
:root{--bg:#FFFFFF;--fg:#111111;--mute:#6B6B72;--line:#E4E4E7;--w:72rem;
--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--sans:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;color-scheme:dark}}
:root[data-theme='dark']{--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:19px;line-height:1.95;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.frame{width:100%;max-width:var(--w);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.pad{padding-left:clamp(18px,4vw,56px);padding-right:clamp(18px,4vw,56px)}
.bar{display:flex;justify-content:space-between;align-items:center;height:56px;border-bottom:1px solid var(--line);font-size:14px}
.bar a{text-decoration:none}.bar .back{color:var(--mute)}.bar .back:hover{color:var(--fg)}
article{max-width:56em;margin:0 auto;padding-top:48px;padding-bottom:80px}
.date{font-family:var(--mono);font-size:12px;color:var(--mute);margin:0}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.3;letter-spacing:-.03em;margin:12px 0 0;font-weight:600;text-wrap:balance}
.sum{margin:20px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--mute);font-size:14.5px;line-height:1.8}
.body p{margin:1.1em 0}
.body h2{font-size:1.35rem;margin:2em 0 .4em;letter-spacing:-.02em}
.body img{max-width:100%}
.body img{height:auto;border:1px solid var(--line);border-radius:4px}
.err{padding:80px 0;color:var(--mute)}
.cm{margin-top:56px;padding-top:8px;border-top:1px solid var(--line);font-size:16px;line-height:1.8}.cm h2{font-size:1.35rem;margin:20px 0 4px;letter-spacing:-.02em}.cm-tip{color:var(--mute);font-size:14px;margin:0 0 16px}.cm-item{padding:14px 0;border-bottom:1px solid var(--line)}.cm-item b{font-weight:600}.cm-item small{font-family:var(--mono);color:var(--mute);margin-left:8px;font-size:12px}.cm-item p{margin:4px 0 0;white-space:pre-wrap}.cm-form{display:grid;gap:10px;margin-top:20px}.cm-form input,.cm-form textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 12px;width:100%}.cm-form textarea{min-height:96px;resize:vertical}.cm-form .cm-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}.cm-act{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--mute)}.cm-act button{font:inherit;font-size:14px;cursor:pointer;color:var(--bg);background:var(--fg);border:1px solid var(--fg);border-radius:4px;padding:8px 18px;min-height:44px}.cm-act button:disabled{opacity:.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* 防溢出兜底 */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
img,video,pre,table{max-width:100%}
pre{overflow-x:auto}
h1,h2,h3,h4,h5,h6,p{overflow-wrap:break-word;word-break:break-word}
/* 手机：点击区域、正文字号与行距 */
@media (max-width:760px){
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.bar a{display:flex;align-items:center;min-height:44px}
}
@media (max-width:480px){
body{font-size:17px;line-height:1.9}
article{padding-top:28px;padding-bottom:56px}
h1{font-size:clamp(1.5rem,7vw,1.8rem);line-height:1.35}
.sum{font-size:14px;margin-top:16px}
.body h2{font-size:1.2rem;margin:1.8em 0 .4em;line-height:1.5}
.body p{margin:1em 0}
}
</style>
<link rel='stylesheet' href='/theme.css'>
</head>
<body>
<div class='frame'>
<div class='bar pad'><a class='back' href='/blog'>← 返回博客</a><a href='/'>刘涛 Todd</a></div>
<article class='pad' id='post'><p class='err'>加载中…</p></article>
</div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var id=location.pathname.split('/').pop();
  function render(b){
    var out=[],para=[];
    function flush(){if(para.length){out.push('<p>'+esc(para.join('\n')).replace(/\n/g,'<br>')+'</p>');para=[]}}
    String(b||'').split('\n').forEach(function(l){
      var t=l.trim();
      var m=t.match(/^!\[[^\]]*\]\((\/posts-img\/[^)\s]+)\)$/);
      if(!t){flush();return}
      if(m){flush();out.push('<p><img loading="lazy" alt="" src="'+esc(m[1])+'"></p>');return}
      if(/^#{1,3}\s+/.test(t)){flush();out.push('<h2>'+esc(t.replace(/^#{1,3}\s+/,''))+'</h2>');return}
      para.push(t);
    });
    flush();
    return out.join('');
  }
  function initComments(pid){var box=document.getElementById('cm');if(!box)return;box.innerHTML='<h2>留言</h2><p class=cm-tip>留言需要我审核通过后才会公开显示。</p><div id=cm-list></div><div class=cm-form><input id=cm-name maxlength=30 placeholder=昵称 aria-label=昵称><textarea id=cm-text maxlength=1000 placeholder=说点什么… aria-label=留言内容></textarea><input id=cm-web class=cm-hp tabindex=-1 autocomplete=off aria-hidden=true><div class=cm-act><span id=cm-msg role=status></span><button id=cm-send type=button>提交留言</button></div></div>';var api='/api/posts/'+encodeURIComponent(pid)+'/comments';function load(){fetch(api,{cache:'no-store'}).then(function(r){return r.json()}).then(function(l){document.getElementById('cm-list').innerHTML=(Array.isArray(l)&&l.length)?l.map(function(c){return '<div class=cm-item><b>'+esc(c.name)+'</b><small>'+esc(String(c.at||'').slice(0,10))+'</small><p>'+esc(c.content)+'</p></div>'}).join(''):'<p class=cm-tip>还没有公开的留言。</p>'}).catch(function(){})}document.getElementById('cm-send').addEventListener('click',function(){var n=document.getElementById('cm-name').value.trim(),t=document.getElementById('cm-text').value.trim(),m=document.getElementById('cm-msg'),b=this;if(!n||t.length<2){m.textContent='请填写昵称和留言内容';return}b.disabled=true;m.textContent='提交中…';fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,content:t,website:document.getElementById('cm-web').value})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||'提交失败');return j})}).then(function(){m.textContent='已提交，审核通过后会显示。';document.getElementById('cm-text').value=''}).catch(function(e){m.textContent=e.message}).then(function(){b.disabled=false})});load()}
  fetch('/api/posts/'+encodeURIComponent(id),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('nf');return r.json()}).then(function(p){
    document.title=p.title+' · 刘涛 Todd';
    var paras=render(p.body);
    document.getElementById('post').innerHTML='<p class="date">'+esc(p.date||'')+'</p><h1>'+esc(p.title)+'</h1>'+(p.summary?'<p class="sum">'+esc(p.summary)+'</p>':'')+'<div class="body">'+paras+'</div><section class=cm id=cm></section>';initComments(p.id);
  }).catch(function(){document.getElementById('post').innerHTML='<p class="err">文章不存在，或还没有发布。</p>'});
})();
</script>
<script src='/theme.js'></script>
</body>
</html>
