<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>博客 · 刘涛 Todd</title>
<style>
/* 布局：线框内居中，列表占满框宽，日期-标题-摘要 */
:root{--bg:#FFFFFF;--fg:#111111;--mute:#6B6B72;--line:#E4E4E7;--card:#FFFFFF;--soft:#F7F7F8;--accent:#111111;--w:72rem;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme='light']){--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}}
:root[data-theme='dark']{--bg:#0B0B0D;--fg:#F2F2F3;--mute:#9A9AA2;--line:#26262B;--card:#101013;--soft:#16161A;--accent:#F2F2F3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.8;-webkit-font-smoothing:antialiased}
a{color:inherit}
.frame{width:100%;max-width:var(--w);margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);min-height:100vh}
.pad{padding-left:clamp(18px,4vw,56px);padding-right:clamp(18px,4vw,56px)}
.bar{display:flex;justify-content:space-between;align-items:center;height:60px;border-bottom:1px solid var(--line);font-size:15.5px;gap:16px}
.bar a{text-decoration:none}.bar nav{display:flex;gap:22px;color:var(--mute)}.bar nav a:hover,.bar nav .on{color:var(--fg)}
main{padding-top:48px;padding-bottom:80px}
.kicker{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:-.04em;margin:10px 0 0;font-weight:600}
.lead{color:var(--mute);margin:12px 0 28px;font-size:1.05rem}
.posts{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.posts li{border-bottom:1px solid var(--line)}
.posts a{display:grid;grid-template-columns:120px minmax(0,1fr) 24px;gap:24px;align-items:baseline;padding:24px 0;text-decoration:none}
.posts a:hover h3{text-decoration:underline;text-underline-offset:4px}
.date{font-family:var(--mono);font-size:13.5px;color:var(--mute)}
.posts h3{margin:0;font-size:20px;font-weight:600;line-height:1.5}
.posts p{margin:6px 0 0;font-size:15.5px;color:var(--mute);line-height:1.75}
@media (max-width:700px){.posts a{grid-template-columns:1fr;gap:4px}}
/* 标签栏：胶囊按钮，选中态反色；窄屏横向滚动不换行 */
.tags{display:flex;gap:8px;margin:20px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tags button{flex:none;white-space:nowrap;font:inherit;font-size:14.5px;line-height:1;padding:9px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--mute);cursor:pointer}
.tags button:hover{background:var(--soft);color:var(--fg)}
.tags button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tags button .n{font-family:var(--mono);font-size:12.5px;margin-left:6px;opacity:.7}
/* 防溢出兜底 */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){html,body{overflow-x:clip}}
img,video,pre,table{max-width:100%}
h1,h2,h3,h4,h5,h6,p{overflow-wrap:break-word;word-break:break-word}
/* 手机：导航与博客列表 */
@media (max-width:480px){
.bar nav{gap:12px;font-size:14px;flex-wrap:nowrap;overflow-x:auto;min-width:0;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{flex:none;white-space:nowrap}
.posts h3{font-size:17px}
.posts a{padding:18px 0}
}
/* 手机补充：导航点击区域、标签栏边到边滚动、去掉单独占行的箭头 */
@media (max-width:760px){
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
}
@media (max-width:700px){
.posts a>span.date:last-child{display:none}
}
@media (max-width:480px){
.bar{gap:8px;font-size:15px}
.bar a{display:flex;align-items:center;min-height:44px;white-space:nowrap}
.bar nav{gap:0;margin-right:-6px}
.bar nav a{padding:0 6px}
main{padding-top:28px;padding-bottom:56px}
h1{line-height:1.25}
.tags{margin:16px calc(-1*clamp(18px,4vw,56px)) 0;padding:0 clamp(18px,4vw,56px)}
.tags button{min-height:44px;padding:0 16px}
.lead{margin:14px 0 18px;font-size:15px}
}
</style>
<link rel='stylesheet' href='/theme.css'>
</head>
<body>
<div class='frame'>
<div class='bar pad'><a href='/'>← 刘涛 Todd</a><nav><a href='/'>首页</a><a href='/courses'>课程</a><a class='on' href='/blog'>博客</a><a href='/chat'>聊聊</a></nav></div>
<main class='pad'>
<p class='kicker'>Blog</p>
<h1>博客</h1>
<div class='tags' id='tags' role='tablist' aria-label='文章分类'></div>
<p class='lead' id='cnt'>加载中…</p>
<ul class='posts' id='list'></ul>
</main>
</div>
<script>
(function(){
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  var TAGS=[['all','全部'],['original','原创'],['paper','论文'],['news','资讯']],cur='all',counts=null,seq=0;
  var bar=document.getElementById('tags'),cnt=document.getElementById('cnt'),list=document.getElementById('list');
  function fromHash(){var h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}return TAGS.some(function(t){return t[0]===h})?h:'all'}
  function renderBar(){bar.innerHTML=TAGS.map(function(t){var n=counts?(t[0]==='all'?counts.original+counts.paper+counts.news:counts[t[0]]):null;return '<button type="button" role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===cur)+'" class="'+(t[0]===cur?'on':'')+'">'+t[1]+(n==null?'':'<span class="n">'+n+'</span>')+'</button>'}).join('')}
  function load(){
    var my=++seq;
    cnt.textContent='加载中…';
    fetch('/api/posts'+(cur==='all'?'':'?tag='+cur),{cache:'no-store'}).then(function(r){return r.json()}).then(function(l){
      if(my!==seq)return;
      cnt.textContent=l.length?('共 '+l.length+' 篇，按时间倒序。'):(cur==='all'?'博客整理中，很快更新。':'这个分类下暂时还没有文章。');
      list.innerHTML=l.map(function(a){return '<li><a href="/post/'+encodeURIComponent(a.id)+'"><span class="date">'+esc(a.date||'')+'</span><div><h3>'+esc(a.title)+'</h3>'+(a.summary?'<p>'+esc(a.summary)+'</p>':'')+'</div><span class="date">→</span></a></li>'}).join('');
    }).catch(function(){if(my===seq)cnt.textContent='加载失败，请刷新重试。'});
  }
  bar.addEventListener('click',function(e){var b=e.target.closest('button[data-t]');if(b)location.hash=b.getAttribute('data-t')});
  window.addEventListener('hashchange',function(){cur=fromHash();renderBar();load()});
  fetch('/api/tags',{cache:'no-store'}).then(function(r){return r.json()}).then(function(c){counts=c;renderBar()}).catch(function(){});
  cur=fromHash();renderBar();load();
})();
</script>
<script src='/theme.js'></script>
</body>
</html>
