name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/admin/ToddSite
            mkdir -p ~/backup
            cp -a data ~/backup/data-$(date +%F-%H%M%S)
            git fetch origin main
            git reset -q origin/main
            git checkout origin/main -- . ':(exclude)data'
            pm2 restart toddsite
            sleep 3
            curl -fsS http://127.0.0.1:3000/api/site > /dev/null
            echo deployed $(git rev-parse --short HEAD)
