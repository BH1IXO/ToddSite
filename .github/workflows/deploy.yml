name: Deploy

# 服务器直连 github.com 不稳定（TLS 中断 / 连接超时），所以不再在服务器上 git fetch。
# 现在由 runner 检出代码、打包，再经 SSH 推到服务器解包并重启；data/ 不动。

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Package
        run: tar --exclude=./.git --exclude=./.github --exclude=./data --exclude=./node_modules -czf /tmp/site.tgz .

      - name: Upload and restart over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          ok=0
          for i in 1 2 3; do
            if scp $OPTS /tmp/site.tgz "$SSH_USER@$HOST:/tmp/site.tgz"; then ok=1; break; fi
            echo "scp attempt $i failed"; sleep 5
          done
          [ "$ok" = 1 ]
          ssh $OPTS "$SSH_USER@$HOST" 'bash -s' <<'REMOTE'
          set -eu
          APP=/home/admin/ToddSite
          cd "$APP"
          mkdir -p ~/backup
          cp -a data ~/backup/data-$(date +%F-%H%M%S)
          ls -dt ~/backup/data-* 2>/dev/null | tail -n +15 | xargs -r rm -rf
          tar xzf /tmp/site.tgz -C "$APP"
          rm -f /tmp/site.tgz
          mkdir -p data/users
          pm2 restart toddsite </dev/null
          sleep 3
          curl -fsS http://127.0.0.1:3000/api/site > /dev/null
          curl -fsS "http://127.0.0.1:3000/api/chat/history?uid=none" | grep -q '"messages"'
          echo deployed
          REMOTE
